name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Run Core & Integration Tests
        run: npx vitest run tests/v43-customer-factory-integration.test.ts tests/parametric-engine.test.ts tests/technical-outputs.test.ts tests/pricing-engine.test.ts tests/manufacturing-bom.test.ts tests/sheet-nesting.test.ts tests/security-validation.test.ts
